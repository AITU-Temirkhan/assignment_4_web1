<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --green: #0F6B5F;
  --orange: #F2A93B;
  --dark: #16302B;
  --bg: #F4F7F5;
  --line: #E6EFEC;
}

body {
  font-family: "Montserrat", sans-serif;
  font-size: .8rem;
  color: var(--dark);
  background: var(--line);
}

.ticket {
  border: 0;
  border-radius: 1.25rem;
  overflow: hidden;
  box-shadow: 0 .75rem 2rem rgba(15, 107, 95, .22);
}
.ticket-head {
  background: var(--green);
  color: #fff;
  font-size: 1.25rem;
  font-weight: 700;
  padding: 1.25rem 1.5rem;
}

.form-label, legend {
  float: none;
  width: auto;
  margin-bottom: .25rem;
  font-size: .75rem;
  font-weight: 600;
}

.form-control, .form-select {
  font-size: .8rem;
  background-color: var(--bg);
  border: 1px solid var(--line);
  border-radius: .75rem;
}
.form-control:focus, .form-select:focus {
  background-color: var(--bg);
  border-color: var(--green);
  box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .2);
}

.form-floating { --bs-body-bg: transparent; }
.form-floating > .form-control { padding-top: 1.625rem; padding-bottom: .5rem; }
.form-floating > .form-control::placeholder { color: #3d5550; opacity: 1; }
.form-floating > .form-control ~ label {
  transform: scale(.8) translateY(-.5rem) translateX(.15rem);
  opacity: .65;
}

.form-check-input:checked {
  background-color: var(--green);
  border-color: var(--green);
}
.form-check-input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .25);
}

.trip {
  border: 1px solid var(--green);
  border-radius: 50rem;
  overflow: hidden;
}
.trip .btn {
  --bs-btn-color: var(--green);
  --bs-btn-hover-color: var(--green);
  --bs-btn-hover-bg: transparent;
  --bs-btn-active-color: #fff;
  --bs-btn-active-bg: var(--green);
  --bs-btn-border-width: 0;
  border-radius: 0;
  padding: .4rem 1.2rem;
  font-size: .75rem;
  font-weight: 600;
}

.input-group-text {
  background: var(--green);
  color: #fff;
  border: 0;
  border-radius: .75rem;
  font-weight: 600;
}

.btn-find, .btn-clear {
  border-radius: 50rem;
  padding: .55rem 1.8rem;
  font-size: .8rem;
  font-weight: 700;
}
.btn-find {
  --bs-btn-color: var(--dark);
  --bs-btn-bg: var(--orange);
  --bs-btn-border-color: var(--orange);
  --bs-btn-hover-color: var(--dark);
  --bs-btn-hover-bg: #e19a2b;
  --bs-btn-hover-border-color: #e19a2b;
  --bs-btn-active-color: var(--dark);
  --bs-btn-active-bg: #d18c22;
}
.btn-clear {
  --bs-btn-color: var(--dark);
  --bs-btn-bg: #fff;
  --bs-btn-border-color: var(--dark);
  --bs-btn-hover-color: var(--dark);
  --bs-btn-hover-bg: var(--bg);
  --bs-btn-hover-border-color: var(--dark);
  --bs-btn-active-color: var(--dark);
  --bs-btn-active-bg: var(--line);
}
</style>
</head>
<body>
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-9 col-xl-7">

        <form class="card ticket" action="#">
          <h1 class="ticket-head m-0">Book a train ticket</h1>

          <div class="card-body p-3 p-md-4">
            <div class="row g-3">

              <div class="col-12">
                <div class="btn-group trip" role="group" aria-label="Trip type">
                  <input type="radio" class="btn-check" name="trip" id="oneway" value="one-way" checked>
                  <label class="btn" for="oneway">One way</label>
                  <input type="radio" class="btn-check" name="trip" id="round" value="round-trip">
                  <label class="btn" for="round">Round trip</label>
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from" placeholder="Astana" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to" placeholder="Almaty" required>
                  <label for="to">To</label>
                </div>
              </div>

              <div class="col-md-4">
                <label for="departure" class="form-label">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-md-4">
                <label for="return" class="form-label">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-md-4">
                <label for="passengers" class="form-label">Passengers</label>
                <select class="form-select" id="passengers" name="passengers" required>
                  <option value="1">1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>

              <fieldset class="col-12">
                <legend>Carriage class</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="class" id="seat" value="seat" required>
                  <label class="form-check-label" for="seat">Seat</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="class" id="coupe" value="coupe" checked>
                  <label class="form-check-label" for="coupe">Coupé</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="class" id="sleeper" value="sleeper">
                  <label class="form-check-label" for="sleeper">Sleeper</label>
                </div>
              </fieldset>

              <div class="col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel-national" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
              </div>

              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                  <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                  <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                </div>
              </div>

              <div class="col-12 d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
                <button type="reset" class="btn btn-clear">Clear</button>
                <button type="submit" class="btn btn-find">Find trains</button>
              </div>

            </div>
          </div>
        </form>

      </div>
    </div>
  </main>
</body>
</html>
